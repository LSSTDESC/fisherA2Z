name: Publish to PyPI

# Publishes fisher-a2z to PyPI when a GitHub Release is published.
# Authentication uses PyPI Trusted Publishing (OIDC) -- no API token is stored
# in this repository. See the "Trusted publisher" setup notes in the README of
# this workflow's PR / the project docs.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release tag is available to the build.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # PyPI refuses to overwrite an existing file and reports it only as a bare
      # "400 Bad Request", so catch a tag/version mismatch here where the error
      # can actually say what is wrong.
      - name: Verify built version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz)
          built=$(basename "$sdist" .tar.gz)
          built=${built#fisher_a2z-}
          expected=${TAG#v}
          echo "Release tag:    $TAG (expected version $expected)"
          echo "Built version:  $built"
          if [ "$built" != "$expected" ]; then
            echo "::error::Built version '$built' does not match release tag '$TAG'." \
                 "The tag must point at a commit whose setuptools_scm version resolves" \
                 "to '$expected'; uploading would fail with a 400 from PyPI."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Must match the environment name configured on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/fisher-a2z

    permissions:
      # Required for OIDC; this is what lets PyPI verify the workflow's identity.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
